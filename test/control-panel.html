<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tug of War — Test Control Panel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#0d0507;color:#fff;min-height:100vh;padding:24px}
  h1{font-size:20px;margin-bottom:16px;color:#ffd27a;letter-spacing:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:960px}
  .panel{background:rgba(30,10,5,.7);border:1px solid rgba(255,150,50,.25);border-radius:12px;padding:16px}
  .panel.wide{grid-column:1/-1}
  h2{font-size:13px;color:#ffd27a;margin-bottom:12px;letter-spacing:1px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  button{background:linear-gradient(#3a1408,#1a0604);color:#fff;border:1px solid rgba(255,150,50,.35);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s}
  button:hover{border-color:#f84;box-shadow:0 0 16px rgba(255,120,40,.4)}
  button:focus-visible,input:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
  button:disabled{opacity:.5;cursor:wait}
  .a{border-color:rgba(255,77,94,.6)}.b{border-color:rgba(77,195,255,.6)}.danger{border-color:rgba(255,50,50,.7);color:#f88}
  input{background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,150,50,.25);border-radius:6px;padding:6px 10px;font-size:13px;width:130px}
  #bar{height:10px;border-radius:6px;overflow:hidden;display:flex;background:#222;margin:8px 0}
  #bar i{display:block;transition:width .4s}
  #ba{background:#ff4d5e;width:50%}#bb{background:#4dc3ff;width:50%}
  #state{font:12px/1.7 'Courier New',monospace;background:rgba(0,0,0,.6);border:1px solid rgba(255,150,50,.2);border-radius:10px;padding:14px}
  .ta{color:#ff4d5e}.tb{color:#4dc3ff}
</style>
</head>
<body>
<h1>🧪 TUG-OF-WAR — TEST CONTROL PANEL</h1>
<div class="grid">
  <div class="panel"><h2>Join</h2><div class="row">
    <input id="user" value="alice" aria-label="username" />
    <button class="a" data-p="join" data-t="A">Join A</button><button class="b" data-p="join" data-t="B">Join B</button></div></div>

  <div class="panel"><h2>Buy</h2>
    <div class="row"><button class="a" data-p="food" data-t="A">🍽 Food A +15</button><button class="b" data-p="food" data-t="B">🍽 Food B +15</button></div>
    <div class="row"><button class="a" data-p="drink" data-t="A">🥤 Drink A +5</button><button class="b" data-p="drink" data-t="B">🥤 Drink B +5</button></div></div>

  <div class="panel"><h2>Gift</h2>
    <div class="row"><input id="gift" value="Lion" aria-label="gift name" /><input id="count" type="number" min="1" value="1" style="width:64px" aria-label="count" /></div>
    <div class="row"><button class="a" data-p="gift" data-t="A">🎁 Gift A</button><button class="b" data-p="gift" data-t="B">🎁 Gift B</button></div></div>

  <div class="panel"><h2>Round</h2>
    <div class="row"><button data-p="speedup">⏩ Skip to 10s</button><button class="danger" data-p="end">⏹ End Round</button></div>
    <div class="row"><button data-p="reset">🔄 New Round</button><button id="autoBtn">🎲 Auto 30s</button></div></div>

  <div class="panel wide"><h2>Scenarios</h2><div class="row" id="scen"></div></div>

  <div class="panel wide"><h2>Live State</h2><div id="bar"><i id="ba"></i><i id="bb"></i></div><div id="state">Connecting…</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const user = () => $('user').value.trim() || 'tester';

async function call(path, body = {}) {
  const r = await fetch('/test/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status);
}
const safe = (fn) => async (...a) => { try { await fn(...a); } catch (e) { alert('Failed: ' + e.message); } };

document.addEventListener('click', safe(async (e) => {
  const b = e.target.closest('button[data-p]'); if (!b) return;
  const { p, t } = b.dataset;
  const body = t ? { team: t, user: user() } : {};
  if (p === 'gift') { body.gift = $('gift').value || 'Lion'; body.count = Math.max(1, Number($('count').value) || 1); }
  await call(p, body);
}));

const SCEN = {
  'A landslide': async () => { for (let i = 0; i < 20; i++) { await call('food', { team: 'A' }); await sleep(200); } for (let i = 0; i < 3; i++) { await call('drink', { team: 'B' }); await sleep(400); } },
  'Close match': async () => { for (let i = 0; i < 15; i++) { await call('food', { team: 'A' }); await sleep(150); await call('food', { team: 'B' }); await sleep(150); } },
  'Gift storm':  async () => { for (let i = 0; i < 8; i++) { await call('gift', { team: 'A', gift: 'Universe' }); await sleep(300); await call('gift', { team: 'B', gift: 'Lion', count: 2 }); await sleep(300); } },
  '20-buy burst':async () => { for (let i = 0; i < 20; i++) { await call('food', { team: i % 2 ? 'A' : 'B' }); await sleep(150); } },
  'Force draw':  async () => call('speedup'),
  'Headline gift': async () => { await call('join', { team: 'A', user: 'superfan_alice' }); await call('gift', { team: 'A', user: 'superfan_alice', gift: 'Universe', count: 5 }); },
};
for (const [name, fn] of Object.entries(SCEN)) {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = safe(async () => { b.disabled = true; try { await fn(); } finally { b.disabled = false; } });
  $('scen').appendChild(b);
}

let autoOn = false;
$('autoBtn').onclick = safe(async () => {
  if (autoOn) { autoOn = false; return; }
  autoOn = true; $('autoBtn').textContent = '⏸ Stop auto';
  const end = Date.now() + 30000;
  while (autoOn && Date.now() < end) {
    const team = Math.random() < .5 + Math.sin(Date.now() / 9000) * .25 ? 'A' : 'B', r = Math.random(), u = 'auto_' + (Math.random() * 99 | 0);
    if (r < .12) await call('join', { team, user: u });
    else if (r < .6) await call('food', { team, user: u });
    else if (r < .85) await call('drink', { team, user: u });
    else await call('gift', { team, user: u, gift: 'Lion', count: 1 });
    await sleep(330);
  }
  autoOn = false; $('autoBtn').textContent = '🎲 Auto 30s';
});

let skew = 0, last = null;
function paint() {
  const s = last; if (!s) return;
  const rem = Math.max(0, Math.round((s.roundEndTime - (Date.now() + skew)) / 1000));
  const tot = s.powerA + s.powerB;
  $('ba').style.width = (tot ? s.powerA / tot * 100 : 50) + '%'; $('bb').style.width = (tot ? s.powerB / tot * 100 : 50) + '%';
  $('state').innerHTML = `<span class="ta">${s.teamA}</span> vs <span class="tb">${s.teamB}</span><br>
Power: <span class="ta">${s.powerA}</span> — <span class="tb">${s.powerB}</span> ${s.powerA > s.powerB ? '(A leads)' : s.powerB > s.powerA ? '(B leads)' : '(tied)'}<br>
Timer: ${rem}s · phase: <b>${s.phase}</b> · Pullers: <span class="ta">${(s.pullersA || []).length}</span> / <span class="tb">${(s.pullersB || []).length}</span><br>
Last winner: ${s.lastWinner || '—'} · Rounds played: ${(s.matchHistory || []).length}`;
}
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'state') { last = m.data; skew = (last.serverTime || Date.now()) - Date.now(); paint(); } };
  ws.onclose = () => { $('state').textContent = 'Disconnected — retrying…'; setTimeout(connect, 1500); };
}
connect(); setInterval(paint, 500);
</script>
</body>
</html>
